# Neutral, first-person, personality-free statement templates for all 223 DDXPlus evidences.
# First-person wording adapted from the existing reviewed statement fields.
# antecedent_kind (antecedents only): 
#   medical_history = conditions, past illnesses, surgeries, medication, family medical_history;
#   non_medical = lifestyle, habits, living/work situation, contacts, travel, sexual behaviour;
# persona_overlap: the evidence describes a trait expression (NEO-PI-R facet of a manipulated Big Five trait). 
#   Cases containing it are excluded from evaluation sampling, because the case content would be indistinguishable from persona expression.
E_91:
  data_type: B
  is_antecedent: false
  original_question: Do you have a fever (either felt or measured with a thermometer)?
  format: binary
  statement: "I have had a fever."
E_55:
  data_type: M
  is_antecedent: false
  original_question: Do you feel pain somewhere?
  format: multi
  statement: "I have pain in {values}."
  negative_values:
    - V_123
  negative_statement: "I have no pain."
E_53:
  data_type: B

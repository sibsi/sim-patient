  negative_statement: "My pain doesn't spread anywhere else."
E_54:
  data_type: M
  is_antecedent: false
  original_question: "Characterize your pain:"
  format: multi-inline
  statement: "My pain feels {values}."
  negative_values:
    - V_11
  negative_statement: null
  value_phrasings:
    V_11: null
    V_71: tearing # DDXPlus translation was too literal (déchirante)
    V_112: throbbing
    V_154: nagging
    V_161: tender
    V_179: like a stab
    V_180: tugging
    V_181: burning
    V_182: like a cramp
    V_183: heavy
    V_184: pulsing
    V_191: violent
    V_192: sharp
    V_193: sickening
    V_196: frightening # originally scary, perhaps not neutral enough
    V_198: exhausting
